{{template "_header" .}}
<h1>All Tags</h1>

{{range $cat, $tags := .Data}}
<details><summary><a href="#tag-{{$cat}}" id="tag-{{$cat}}">{{$cat}}</a>&nbsp;&lpar;<a href="/tag/{{$cat}}/previews">Previews</a>, <a href="/tag/{{$cat}}/unassigned">Unassigned</a>&rpar;</summary>
<ul>
      {{range $tags}}
        <li><a href="/tag/{{$cat}}/{{.Value}}">{{.Value}} ({{.Count}})</a></li>
      {{end}}
</ul>
</details>
{{end}}
{{if gt .UntaggedCount 0}}<a href="/untagged">Untagged ({{.UntaggedCount}})</a>{{end}}

<script src="/static/list-filter.js" defer></script>
<script src="/static/list-open.js" defer></script>

{{template "_footer"}}
